<text x="78" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8d93b8" text-anchor="start" font-weight="500" letter-spacing="0"> 9</text>
<text x="112" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan fill="#a397ff">  return</tspan><tspan fill="#e9ebf7"> lo</tspan></text>
