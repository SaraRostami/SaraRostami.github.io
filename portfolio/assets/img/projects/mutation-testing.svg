<text x="112" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan fill="#a397ff">def</tspan><tspan fill="#e9ebf7"> search(xs, t):</tspan></text>
<text x="78" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8d93b8" text-anchor="start" font-weight="500" letter-spacing="0"> 2</text>
<text x="112" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan fill="#e9ebf7">  lo, hi = 0, len(xs)</tspan></text>
<text x="78" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8d93b8" text-anchor="start" font-weight="500" letter-spacing="0"> 3</text>
<text x="112" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan fill="#a397ff">  while</tspan><tspan fill="#e9ebf7"> lo &lt; hi:</tspan></text>
<text x="78" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8d93b8" text-anchor="start" font-weight="500" letter-spacing="0"> 4</text>
<text x="112" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan fill="#e9ebf7">    mid = (lo + hi) // 2</tspan></text>
