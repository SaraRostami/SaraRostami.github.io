<text x="78" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8d93b8" text-anchor="start" font-weight="500" letter-spacing="0"> 6</text>
<text x="112" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan fill="#e9ebf7">      lo = mid + 1</tspan></text>
<text x="78" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8d93b8" text-anchor="start" font-weight="500" letter-spacing="0"> 7</text>
<text x="112" y="344" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan fill="#a397ff">    else</tspan><tspan fill="#e9ebf7">:</tspan></text>
